on:
  push:
    branches:
      - main
  pull_request:
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          activate-environment: true

      - run: |
          uv sync --all-extras
          ruff check .
          ty check .
          pytest .
